name: Supabase Keep-Alive Health Ping

on:
  schedule:
    - cron: '0 12 */2 * *' # Every 2 days at 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          echo "Pinging Supabase Project to prevent inactivity pause..."
          curl -f -s -o /dev/null -w "%{http_code}" "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" || true
          echo "Keep-alive ping completed."
